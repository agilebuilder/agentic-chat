name: Bootstrap adapter-ai-sdk on npm

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type "publish-adapter-ai-sdk-beta" to confirm the one-time package creation
        required: true
        type: string

concurrency:
  group: npm-beta
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  preflight:
    name: Verify reviewed beta commit
    if: github.ref == 'refs/heads/main' && inputs.confirmation == 'publish-adapter-ai-sdk-beta'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout reviewed commit
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - name: Install pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
        with:
          version: 10.13.1
          run_install: false
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22.23.1
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Validate beta versions and package boundaries
        run: pnpm release:beta:check
      - name: Run repository verification
        run: pnpm verify
      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Run browser quality suite
        run: pnpm quality:browser

  bootstrap:
    name: Create adapter-ai-sdk package
    needs: preflight
    if: github.ref == 'refs/heads/main' && inputs.confirmation == 'publish-adapter-ai-sdk-beta'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: npm-beta
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout reviewed commit
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - name: Install pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
        with:
          version: 10.13.1
          run_install: false
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22.23.1
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - name: Install npm CLI
        run: npm install --global npm@11.18.0
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Validate reviewed beta state
        run: node scripts/check-beta-release.mjs --registry
      - name: Build packages
        run: pnpm build
      - name: Confirm package is not already published
        shell: bash
        run: |
          version=$(node -p "require('./packages/adapter-ai-sdk/package.json').version")
          if npm view "@agentic-chat/adapter-ai-sdk@$version" version >/dev/null 2>&1; then
            echo "The reviewed adapter version already exists; refusing bootstrap."
            exit 1
          fi
      - name: Pack adapter-ai-sdk
        shell: bash
        run: |
          mkdir -p .tmp/bootstrap
          pnpm --dir packages/adapter-ai-sdk pack --pack-destination ../../.tmp/bootstrap --silent
      - name: Publish first adapter version with beta tag and provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_BOOTSTRAP_TOKEN }}
          NPM_CONFIG_PROVENANCE: 'true'
        shell: bash
        run: npm publish .tmp/bootstrap/*.tgz --access public --tag beta
      - name: Verify bootstrap manifest and dist-tags
        run: node scripts/verify-adapter-bootstrap.mjs
